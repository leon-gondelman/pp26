<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quest walkthrough · Lab 7</title>
<!-- Written by teacher/video/assemble.py from teacher/video/player.html: edit the template, not this page. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap">
<style>
:root{--ground:#f5f4f0;--surface:#fff;--ink:#15171c;--ink-2:#3b4250;--rule:#d8d5cd;--accent:#0a5f96;
--track:#dedad1;--played:#3b4250;--mark:#7c3aed;--mark-soft:#efe8fd}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ground:#111318;--surface:#181b22;--ink:#e8eaef;
--ink-2:#b6bdc9;--rule:#2a2f39;--accent:#62b8ee;--track:#2f3540;--played:#b6bdc9;--mark:#a78bfa;--mark-soft:#2a2140}}
:root[data-theme="dark"]{--ground:#111318;--surface:#181b22;--ink:#e8eaef;--ink-2:#b6bdc9;--rule:#2a2f39;
--accent:#62b8ee;--track:#2f3540;--played:#b6bdc9;--mark:#a78bfa;--mark-soft:#2a2140}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:17px/1.6 "IBM Plex Sans",-apple-system,sans-serif}
main{max-width:1120px;margin:0 auto;padding:40px 16px 64px}
.crumb{font-size:14px;color:var(--ink-2);margin:0 0 6px}
.crumb a{color:var(--accent);text-decoration:none}
h1{font:600 34px/1.2 "IBM Plex Serif",Georgia,serif;margin:0 0 24px;text-wrap:balance}
.player{position:relative;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.18)}
video{display:block;width:100%;aspect-ratio:16/9;background:#000;cursor:pointer}
/* the controls over the film: almost invisible while it plays untouched, semi-transparent while the mouse moves */
.controls{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:16px;padding:28px 18px 12px;
  background:linear-gradient(transparent,rgba(0,0,0,.55));opacity:.07;transition:opacity .35s}
.player.awake .controls{opacity:1}
.player.awake video{cursor:pointer}
.player:not(.awake) video{cursor:none}
.play{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.22);color:#fff;cursor:pointer;
  display:grid;place-items:center;padding:0;backdrop-filter:blur(6px)}
.play:hover{background:rgba(255,255,255,.34)}
.play svg{width:13px;height:13px;fill:currentColor}
.time{flex:none;font:500 13px "IBM Plex Mono",monospace;color:rgba(255,255,255,.85);min-width:92px;text-align:right}
.track{position:relative;flex:1;height:30px;cursor:pointer;touch-action:none}
.rail,.done{position:absolute;left:0;top:13px;height:4px;border-radius:2px}
.rail{right:0;background:rgba(255,255,255,.28)}
.done{background:rgba(255,255,255,.85);width:0}
.mark{position:absolute;top:8px;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--mark);
  border:2px solid rgba(255,255,255,.9);padding:0;cursor:pointer;transition:transform .15s}
.mark:hover,.mark:focus-visible,.mark.on{transform:scale(1.35);outline:none}
.tip{position:absolute;bottom:32px;transform:translateX(-50%);white-space:nowrap;background:rgba(20,18,30,.62);color:#fff;
  font-size:14px;padding:5px 11px;border-radius:7px;pointer-events:none;opacity:0;transition:opacity .15s;backdrop-filter:blur(6px)}
.tip.on{opacity:1}
@media (max-width:640px){h1{font-size:27px}.time{display:none}.controls{gap:10px;padding:20px 10px 6px}}
</style>
</head>
<body>
<main>
  <p class="crumb"><a href="../index.html">Lab&nbsp;7</a> · Programming&nbsp;Paradigms</p>
  <h1>Quest&nbsp;walkthrough</h1>
  <div class="player">
    <video id="v" src="quest-walkthrough.mp4" preload="metadata" playsinline></video>
    <div class="controls">
    <button class="play" id="play" aria-label="Play"><svg viewBox="0 0 10 12" id="icon"><path d="M0 0l10 6-10 6z"/></svg></button>
    <div class="track" id="track" role="slider" aria-label="Position in the film" tabindex="0">
      <div class="rail"></div><div class="done" id="done"></div><div class="tip" id="tip"></div>
    </div>
    <span class="time" id="time">0:00</span>
    </div>
  </div>
</main>
<script>
const CHAPTERS = [{"t": 0, "name": "The warm-up, before the quest"}, {"t": 7.77, "name": "Quest, Part 1: Workers"}, {"t": 39.66, "name": "Render.java, holes 1 and 2"}, {"t": 60.72, "name": "The viewer, from quest/"}, {"t": 77.48, "name": "Part 1 run"}, {"t": 95.63, "name": "Station 3: the next hole"}, {"t": 106.75, "name": "Part 2: The progress bar"}, {"t": 122.14, "name": "Render.java, hole 3"}];
const v = document.getElementById("v"), track = document.getElementById("track"), tip = document.getElementById("tip");
const PLAY = '<path d="M0 0l10 6-10 6z"/>', PAUSE = '<path d="M0 0h3.5v12H0zM6.5 0H10v12H6.5z"/>';
const fmt = t => Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0");
let duration = 134.94;
const marks = CHAPTERS.map((c, i) => {
  const m = document.createElement("button");
  m.className = "mark"; m.setAttribute("aria-label", `Step ${i + 1}: ${c.name}`);
  m.onclick = e => { e.stopPropagation(); seek(c.t); };
  m.onmouseenter = m.onfocus = () => { tip.textContent = c.name; tip.style.left = m.style.left; tip.classList.add("on"); };
  m.onmouseleave = m.onblur = () => tip.classList.remove("on");
  track.append(m); return m;
});
function layout() { CHAPTERS.forEach((c, i) => marks[i].style.left = (100 * c.t / duration) + "%"); }
function seek(t) { v.currentTime = Math.max(0, Math.min(t + 0.01, duration)); update(); }
function update() {
  document.getElementById("done").style.width = (100 * v.currentTime / duration) + "%";
  document.getElementById("time").textContent = fmt(v.currentTime) + " / " + fmt(duration);
  let k = -1; CHAPTERS.forEach((c, i) => { if (v.currentTime + 0.05 >= c.t) k = i; });
  marks.forEach((m, i) => m.classList.toggle("on", i === k));
}
function toggle() { v.paused ? v.play() : v.pause(); }
v.addEventListener("loadedmetadata", () => { duration = v.duration || duration; layout(); update(); });
v.addEventListener("timeupdate", update);
v.addEventListener("play", () => { document.getElementById("icon").innerHTML = PAUSE; document.getElementById("play").setAttribute("aria-label", "Pause"); });
v.addEventListener("pause", () => { document.getElementById("icon").innerHTML = PLAY; document.getElementById("play").setAttribute("aria-label", "Play"); });
v.onclick = toggle;
document.getElementById("play").onclick = toggle;
function at(e) { const r = track.getBoundingClientRect(); return duration * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)); }
track.addEventListener("pointerdown", e => {
  if (e.target.classList.contains("mark")) return;
  seek(at(e)); track.setPointerCapture(e.pointerId);
  const move = ev => seek(at(ev)), up = () => { track.removeEventListener("pointermove", move); track.removeEventListener("pointerup", up); };
  track.addEventListener("pointermove", move); track.addEventListener("pointerup", up);
});
document.addEventListener("keydown", e => {
  if (e.target.tagName === "BUTTON" && (e.key === " " || e.key === "Enter")) return;
  if (e.key === " ") { e.preventDefault(); toggle(); }
  if (e.key === "ArrowRight") seek(v.currentTime + 5);
  if (e.key === "ArrowLeft") seek(v.currentTime - 5);
});
// awake while the mouse moves over the film, and while it is paused; asleep 2 s after the last move
const player = document.querySelector(".player");
let sleepTimer = 0;
function wake() {
  player.classList.add("awake"); clearTimeout(sleepTimer);
  sleepTimer = setTimeout(() => { if (!v.paused && !player.querySelector(".controls").matches(":hover")) player.classList.remove("awake"); }, 2000);
}
player.addEventListener("mousemove", wake);
player.addEventListener("touchstart", wake, { passive: true });
player.addEventListener("mouseleave", () => { if (!v.paused) { clearTimeout(sleepTimer); player.classList.remove("awake"); } });
v.addEventListener("pause", () => { clearTimeout(sleepTimer); player.classList.add("awake"); });
v.addEventListener("play", wake);
player.classList.add("awake");
layout(); update();
</script>
</body>
</html>
